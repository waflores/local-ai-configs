[project]
name = "local-config"
version = "0.1.0"
description = "Toolkit for managing local models"
readme = "README.md"
authors = [{ name = "Will Flores", email = "waflores956@gmail.com" }]
license = "MIT"
urls = { homepage = "https://github.com/waflores/local-ai-configs" }
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
check-md-links = "scripts.check_md_links:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"


[tool.ruff.lint]
select = ["B", "D3", "E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLW1510"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = ["flask>=3.1.3", "pytest>=9.1.1", "pytest-cov>=7.1.0"]
