[project]
name = "local-config"
version = "0.1.0"
description = "Toolkit for managing local models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llama-cpp-python",
    "pyyaml>=6.0.3",
]

[project.scripts]
check-md-links = "scripts.check_md_links:main"

[tool.ruff.lint]
select = ["B", "D3", "E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLW1510"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "flask>=3.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
