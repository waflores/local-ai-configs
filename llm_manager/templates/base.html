<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Manager</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #16191f;
      --border: #2a2f3a;
      --text: #e6e6e6;
      --muted: #8a8f98;
      --accent: #58a6ff;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header nav { margin-left: auto; }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    header nav a:hover { color: var(--text); background: var(--bg); }
    header nav a.active { color: var(--accent); font-weight: 600; }
    main { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 15px; }
    .grid { display: grid; gap: 12px; }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 960px) { .grid.cols-2 { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.condensed { flex-direction: row; align-items: center; gap: 10px; }
    .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    .card .value { font-variant-numeric: tabular-nums; }
    .card .value.num { font-family: var(--mono); }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: var(--mono);
      text-transform: uppercase;
    }
    .tag.good { background: rgba(63,185,80,0.15); color: var(--good); }
    .tag.warn { background: rgba(210,153,34,0.15); color: var(--warn); }
    .tag.bad { background: rgba(248,81,73,0.15); color: var(--bad); }
    .tag.info { background: rgba(88,166,255,0.15); color: var(--accent); }
    .tag.muted { background: rgba(138,143,152,0.15); color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .mono { font-family: var(--mono); font-size: 12px; }
    pre.mono { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>LLM Manager</h1>
    <nav>
      <a href="/">Models</a>
      <a href="/hardware">Hardware</a>
      <a href="/configs">Configurations</a>
      <a href="/tuning">Tuning</a>
      <a href="/admin">Directories</a>
      <a href="/api-docs">API docs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    LLaMA-Swap + continue.dev configuration toolkit &middot; local LLM management
  </footer>
</body>
</html>
