# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# Health and logging
healthCheckTimeout: 60
logLevel: debug
logToStdout: "proxy"
# Port and TTL management
startPort: 10001
globalTTL: 0
# ============================================
# Global Settings (Shared across all models)
# ============================================
macros:
  # Common llama-server parameters (override per-model if needed)
  models_directory: "/home/waflores/.lmstudio/models/lmstudio-community"
  cmdPrefix: "/home/waflores/.local/share/inferhost/bin/llama-server"
  nGpuLayers: "all"
  threads: "-1"
  flashAttn: "auto"
  tools: "all"
  device: "CUDA0"
  ctxSize: "262144"
  nPredict: "-1"
  reasoning: "auto"
  reasoningBudget: "-1"
  checkEndpoint: "/health"
  # jinja: "true"
  # contextShift: "true"
  # reranking: "true"
# ============================================
# Models Configuration
# ============================================
models:
  Qwen3.5-9B-GGUF:
    # Display name for API
    name: "Qwen3.5-9B-GGUF"
    # TTL for this specific model (overrides global if set)
    ttl: 600
    env:
      - "GGML_CUDA_ENABLE_UNIFIED_MEMORY=1"
    # Command to start the model server
    # Using | for multi-line with comments
    cmd: |
      ${cmdPrefix} \
        --port ${PORT} \
        --model ${models_directory}/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf \
        --n-gpu-layers ${nGpuLayers} \
        --threads ${threads} \
        --flash-attn ${flashAttn} \
        --jinja \
        --tools ${tools} \
        --device ${device} \
        --ctx-size ${ctxSize} \
        --n-predict ${nPredict} \
        --context-shift \
        --reasoning ${reasoning} \
        --reasoning-budget ${reasoningBudget} \
        --temp 0.6 --top-k 20 --top-p 0.95 --min-p 0 --cache-ram -1 \
        --verbose
    # Optional: Health check endpoint (default: /health)
    checkEndpoint: /health
# ============================================
# Groups Configuration (Legacy but supported)
# ============================================
groups:
  swappable:
    swap: true
    exclusive: true
    members:
      - Qwen3.5-9B-GGUF
# Recommended: Add performance monitoring
performance:
  disabled: false
  every: 15s
