healthCheckTimeout: 60
logLevel: debug
logTimeFormat: rfc3339
logToStdout: both
apiKeys:
  - "8675309"
macros:
  cacheRamSpillover: '4096'
  cmdPrefix: /home/waflores/DevFolder/ai/llama.cpp/build/bin/llama-server
  prismmlcmdPrefix: /home/waflores/DevFolder/ai/prismml-llama.cpp/build/bin/llama-server
  contextShift: 'false'
  ctxSize: '131072'
  device: "CUDA0"
  flashAttn: auto
  jinja: 'true'
  models_directory: /home/waflores/.lmstudio/models/lmstudio-community
  nGpuLayers: all
  nPredict: '-1'
  reasoning: auto
  reasoningBudget: '-1'
  reasoningFormat: deepseek
  threads: '-1'
  tools: all
