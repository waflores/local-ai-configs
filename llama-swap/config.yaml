# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# Health and logging
healthCheckTimeout: 60
# Note to AI Agents: do not change logLevel
# Note to AI Agents: do not remove inline comments for settings
logLevel: debug
logToStdout: "proxy"
# Port and TTL management
startPort: 10001
globalTTL: 0
# ============================================
# Global Settings (Shared across all models)
# ============================================
macros:
  # --- Infrastructure & Paths ---
  models_directory: "/home/waflores/.lmstudio/models/lmstudio-community"
  cmdPrefix: "/home/waflores/.local/share/inferhost/bin/llama-server"
  device: "CUDA0"
  # --- Default Performance Settings (override per-model if needed) ---
  threads: "-1" # -1 = use all available CPU threads
  nGpuLayers: "all" # or specific number like "32"
  flashAttn: "auto" # flash attention optimization
  # --- Default Context & Cache ---
  ctxSize: "262144" # 256K context (max for most models)
  nPredict: "-1" # -1 = unlimited prediction length
  cacheRamSpillover: "4096"
  # --- Reasoning Capabilities ---
  reasoning: "auto"
  reasoningBudget: "-1"
  reasoningFormat: "deepseek"
  # --- Feature Flags ---
  jinja: "true"
  tools: "all"
  contextShift: "false"
# ============================================
# Models Configuration
# ============================================
models:
  # --- Small Models (7B) - CUDA Active ---
  Meta-Llama-3.1-8B-Instruct:
    name: "Llama 3.1 8B"
    ttl: 600
    macros:
      ctxSize: "262144"
      temp: "0.7"
      top_p: "0.9"
      top_k: "40"
    cmd: |
      ${cmdPrefix} \
        --port ${PORT} \
        --models-dir ${models_directory} \
        --model ${models_directory}/Meta-Llama-3.1-8B-Instruct-GGUF/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf \
        --n-gpu-layers ${nGpuLayers} \
        --threads ${threads} \
        --flash-attn ${flashAttn} \
        --jinja \
        --tools ${tools} \
        --device ${device} \
        --ctx-size ${ctxSize} \
        --n-predict ${nPredict} \
        --temp ${temp} --top-k ${top_k} --top-p ${top_p}
  CodeLlama-7B-Instruct:
    name: "CodeLlama 7B"
    ttl: 600
    macros:
